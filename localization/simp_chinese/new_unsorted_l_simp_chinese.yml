 story_ma_bowan_storyline_general: "远方来客"
 story_ma_bowan_storyline_general_desc: "从遥远的[Glossary( '冬之地', '_GLOSS' )]旅行至此，你将从零开始了解陌生的[Glossary( '赛罗希亚', '_GLOSS' )]大陆。在旅途中探索，发掘，并记录吧；但也要小心真相背后的危险......"
 story_ma_bowan_storyline_general_vis_desc: "通过一段漫长的旅途，你将逐渐了解[Glossary( '希里亚', '_GLOSS' )]和[Glossary( '德维利亚', '_GLOSS' )]等地区的现状和历史。接触广泛流传的民间传说，亲自探寻古籍或遗迹，或者听取各色人物的叙述，积累知识并将其记录。\n\n有些知识或许不可避免地偏离事实：你将会接触到许多互相矛盾的说法，而它们背后往往暗藏目的或是立场。谨慎地选择你将记录的内容，这将影响外界对你的看法。稍有不慎，你或许会发现自己和某些势力成为敌人，乃至招来杀身之祸。"

 story_markus_storyline_0: "熄灭溺星"
 story_markus_storyline_0_desc: "[Glossary( '邪教', '_GLOSS' )]信徒在[GetTitleByKey('k_Doria_Litorale').GetBaseNameNoTier]的扭曲统治一直是帝国的心头大患。你将指挥[GetTitleByKey('k_Hiria_Army_5').GetBaseNameNoTier]，彻底消灭这一邪恶存在。"
 story_markus_storyline_0_vis_desc: "扩充战备，计划攻势，并与你的[GetTitleByKey('k_Hiria_Army_2').GetBaseNameNoTier]盟友一同准备向[GetTitleByKey('k_Doria_Litorale').GetBaseNameNoTier]的进攻。在此期间，你的一些决定或许会对战后的局势产生影响......\n\n但这应该不是很重要。戍边十数年，你和将士们都已身心俱疲。倘若战事顺利，在战争结束后，[GetTitleByKey('k_Hiria_Army_5').GetBaseNameNoTier]应该会被调回后方，而你也应该能享受一段闲暇时光了。"
 marcus_story_enemy: "敌方领袖"

 MTC_test.3.t: "分崩离析"
 MTC_test.3.desc: "自从[Glossary( '勒泰事变', '_GLOSS' )]发生以来不过数月，帝国的信仰界已经陷入了完全的混乱。\n\n[GetFaithByKey('new_universal_church').GetName]的建立彻底摧毁了旧[GetFaithByKey('old_universal_church').GetName]的权威，其一直苦心维系的统一假象也因此被彻底摧毁。在地方豪强和各地省督的默许下，从民间的狂信徒再到身居高位的野心家，[GetFaithByKey('old_universal_church').GetName]内部的各个派系纷纷自立山头，宣布脱离其掌控；而长久以来被压抑的[GetReligionFamily('rf_old_beliefs').GetName]也开始蠢蠢欲动，其背后不乏在帝国统治中身居高位者。\n\n[GetTitleByKey('h_Hiria').GetBaseNameNoTier]也许仍然在皇帝的治下维持着政治上的统一，但其信仰已被彻底撕碎，而随之而来的将会是一场或许不亚于[Glossary( '混乱时期', 'CHAOTIC_TIMES_GLOSS' )]的大动乱。"
 MTC_test.3.a: "这将是动荡时代的开始......"

