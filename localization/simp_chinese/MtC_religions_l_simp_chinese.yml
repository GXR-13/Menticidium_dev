communiunism_religion: "共融"
communiunism_religion_adj: "共融"
communiunism_religion_adherent: "共融信徒"
communiunism_religion_adherent_plural: "共融信徒"
communiunism_religion_desc: "共融主义诞生于消灭旧帝国与其神明的希里亚起义，主张通过人与人之间的理解与互助达成人民不被暴君与恶神压迫的理想世界。"

imperial_verita: "总教会"
imperial_verita_adj: "总教会"
imperial_verita_adherent: "平信徒"
imperial_verita_adherent_plural: "平信徒"
imperial_verita_desc: "共融总教会的历史可以追溯到帝国建立前最早期的共融宗教组织，并且自从其信徒发动对旧帝国的起义以来就一直和希里亚的政权密不可分。时至今日，总教会已是一个囊括了帝国广袤领土内所有信徒的庞然大物，再结合其错综复杂的历史，令人难以用三言两语去概况其宗教主张。总体来说，总教会自诩共融正统，摒弃一切神明崇拜，并坚决支持在一个普世帝国的治下达成人之间的共融；可要讨论起许多最具体的宗教主张，人们会发现哪怕是总教会中的最高层人物也难以达成一致。"

eastern_ritualism: "东境诸教会"
eastern_ritualism_adj: "东境诸教会"
eastern_ritualism_adherent: "东境信徒"
eastern_ritualism_adherent_plural: "东境信徒"
eastern_ritualism_desc: "尽管共融信仰在帝国建立早期就传播到了东境，但受限于对该地的控制力，各类宗教事务都处于相当自治的状态下。经历混乱时期东境的叛离和崩溃，共融信仰在东境的权力最终集中在了数个与当地世俗统治者关系密切的当地教会手中；而当希里亚再征服东境的尝试失败后，这一关系被正式确定了下来，构成了如今东境信仰的现状：各个自主教会依附于当地的世俗政权，信仰事务和对宗教理念的解释都在很大程度上受到政治斗争的影响。"

southern_ritualism: "南仪教会"
southern_ritualism_adj: "南仪教会"
southern_ritualism_adherent: "南仪信徒"
southern_ritualism_adherent_plural: "南仪信徒"
southern_ritualism_desc: "南方仪式论脱胎于北多里亚混乱的政治环境，以及其长久以来在帝国统治中的高度自治地位。与彻底脱缰的东境诸教会不同，他们在名义上仍然听命于希里亚方面的总教会，但由于北多里亚诸侯的特殊地位，许多权力被下放给当地的教会“自行解决”。时过境迁，多里亚地区的共融信仰形成了一种带有综摄主义的“南方仪式”，并且其信徒也愈发与帝国中央产生隔阂。"

