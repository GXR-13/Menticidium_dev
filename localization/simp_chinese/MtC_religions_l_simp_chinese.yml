frazione_del_litorale_desc: "滨海多里亚地区在混乱时期前曾受希里亚共融教会主导。在混乱时期的灾难与战乱中，当地有关海中恶神的传说逐步复兴，而随着中央在远南的控制崩溃，哪怕是帝国在此驻扎的官僚都逐渐将其信仰转向了更加异质的形式。最终，整片地区在对传说中灾难的恐惧中形成了一种更有组织的信仰。在海洋教派所统治的地区，人们毫无遮掩地信仰“海中溺星”等形象，并且牲畜乃至活人祭祀都司空见惯。"

