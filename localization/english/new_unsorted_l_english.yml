 story_ma_bowan_storyline_general: "Visitor from afar"
 story_ma_bowan_storyline_general_desc: "Traveling far away from the distant lands of [Glossary( 'Dōng', '_GLOSS' )], you will start to know about [Glossary( 'Therosia', '_GLOSS' )] from nothing. Explore, dig and record through your journey. Meanwhile, beware what's hidden beneath the truth......"
 story_ma_bowan_storyline_general_vis_desc: "Through a long journey, you will start to know the current and history about [Glossary( 'Hiria', '_GLOSS' )], [Glossary( 'Dwilia', '_GLOSS' )] and beyond. Through folklore, ancient texts, relics or words from various characters, gather knowledge and record them.\n\nSome of those knowledge may inevitably be deviated: you will face contradicting claims, and the hidden motives or stands behind them.Chose wisely what you will write down, as this may decide how the others see you. One step wrong, you may find yourself an unwelcome guest, or even perhaps lose your life."
 story_markus_storyline_0: "Extinguish the Drowned Star"
 story_markus_storyline_0_desc: "[Glossary( 'Cultists', '_GLOSS' )] and their twisted rule in [GetTitleByKey('k_Doria_Litorale').GetBaseNameNoTier] has always been a thorn at the Empire's side. You will command the [GetTitleByKey('k_Hiria_Army_5').GetBaseNameNoTier] and take these wicked foes down for good."
 story_markus_storyline_0_vis_desc: "Prepare for the upcoming war, plan the offensive, and launch the attack against [GetTitleByKey('k_Doria_Litorale').GetBaseNameNoTier] together with your [GetTitleByKey('k_Hiria_Army_2').GetBaseNameNoTier] allies. During now, some of your choices may influence what would happen after the war......\n\nBut that won't be your concern. After more than a decade of years watching the border, both you and your men were exhausted. If the war goes well, the [GetTitleByKey('k_Hiria_Army_5').GetBaseNameNoTier] would be redeployed to the rear after the offensive, and you could enjoy your time by then."
 marcus_story_enemy: "Enemy Leader"
 MTC_test.3.t: "Falling Apart"
 MTC_test.3.desc: "Merely months passed since[Glossary( 'what happened in Lerthai', '_GLOSS' )], and the religion of the Empire has fallen into complete chaos.\n\nThe establishment of [GetFaithByKey('new_universal_church').GetName] has ruined the authority of the old [GetFaithByKey('old_universal_church').GetName], together with it, the illusion of unity it has always tried to maintain. With the acquiescence by local nobilities and imperial inspectors, factions within the [GetFaithByKey('old_universal_church').GetName] started to rally themselves under figures ranging from grassroots zealots to high-ranking ambitious figures, breaking from control. Long supressed [GetReligionFamily('rf_old_beliefs').GetName] started to stir, with no lack of support from high-ranking officials.\n\n[GetTitleByKey('h_Hiria').GetBaseNameNoTier] may still retained political unity under the reign of the emperor, yet its faith now torn apart, what follows may be a riot matching the once [Glossary( 'chaotic times', 'CHAOTIC_TIMES_GLOSS' )]."
 MTC_test.3.a: "This will be the start of a time of turmoil......"
