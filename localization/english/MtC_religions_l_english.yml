l_english:
 communiunism_religion: "communiunism"
 communiunism_religion_adj: "communiunism"
 communiunism_religion_adherent: "communiunist"
 communiunism_religion_adherent_plural: "communiunist"
 communiunism_religion_desc: "The Communionism religion was born in the great uprising which brought down the old empire and its gods, advocates to forge an ideal world where people would be no longer oppressed by tyrants and wicked gods, through understanding between men."
 imperial_verita: "Universal Church"
 imperial_verita_adj: "Universal Church"
 imperial_verita_adherent: "common devotees"
 imperial_verita_adherent_plural: "common devotees"
 imperial_verita_desc: "The Universal Communion Church could trace its history to the early religious organizations rooted before the establishment of the Empire, and entangled itself with Hirian politics since its devotees started the uprising against the Old Empire. Till today, the Universal Church is a colossus containing all believers within the vast territories of the Empire, together with its complicated history, making it hard to describe their religious views. In general, the Universal Church proclaims itself the orthodox communionism, which renounces all worshipment to any gods, and advocates that the establishment of communion between people must be achieved under the rule of a universal empire. However, when it comes to more specific religious views, it would be found that even those among the highest ranks in the church couldn't find an agreement."
 eastern_ritualism: "Eastern Churches"
 eastern_ritualism_adj: "Eastern Churches"
 eastern_ritualism_adherent: "Dwilian devotees"
 eastern_ritualism_adherent_plural: "Dwilian devotees"
 eastern_ritualism_desc: "While communionism faiths have spread to the east since the Empire was established, most religious affairs remain highly autonomous due to the lack of political control in the region. After the rebellion and collapse of Dwilian Autocracy during the Chaotic Times, Power of eastern communionism faiths eventually fell in the hands of multiple local churchers which has close relations to secular rulers. After the falure of Hirians reconquering the East, the previous relation was formalized, forming the basis of faiths in the East nowdays: various autonomous churches rely themselves on local secular regimes, while religious matters and explainations to religious ideals are influenced by political conflicts to a certain degree."
 southern_ritualism: "Southern Ritualist Church"
 southern_ritualism_adj: "Southern Ritualist Church"
 southern_ritualism_adherent: "southern devotees"
 southern_ritualism_adherent_plural: "southern devotees"
 southern_ritualism_desc: "Southern ritualism was born in chaotic political enviroment of Doria Norde, as well as its highly autonomous status within imperial rule. Unlike the Eastern Churches which went rogue completely, the Southern Church still follows the lead of the Universal Church in Hiria in name, yet because of the special status of Doria Norde lords, the power of decision to many affairs were granted to local church. As time passes, Communionism in Doria region formed their 'Southern Rituals' with sncretism, and its devotees went further away from the way of the Empire."
