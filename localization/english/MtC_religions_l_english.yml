 frazione_del_litorale_adherent_plural: "Sea Cultists"
 frazione_del_litorale_desc: "The region of Doria Litorale was once dominated by Hirian Communiunism. During the disasters and wars of the Chaotic Times, a legend of 'evil god in the sea' began to resurge, and as Hirian control shatters in the far south, even many bureaucrats stationed there turned their faith into stranger forms. Eventually, a more organized form of faith was formed under the fear of the disaster believed to come. Under the rule of the Cult of the Sea, people worship figures like 'Drowned Star in the sea' openly. Animals, even human sacrifices became trivial."
